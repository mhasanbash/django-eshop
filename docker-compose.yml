services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file: .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data  
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    env_file: .env
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    command: sh -c "cd backend && uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/store/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: 'deploy_ng'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/vol/static:ro
      - ./backend/media:/vol/media:ro

      - ../eshop/dist:/usr/share/nginx/pgmode

      - ./deploy/nginx/ssl:/etc/letsencrypt
      - ./deploy/nginx/www:/var/www/certbot
      - ./deploy/nginx/nginx-errors:/usr/share/nginx-errors/html
    depends_on:
      - web

  redis:
    image: redis:7-alpine
    container_name: redis



